[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toyflow"
version = "0.1.0"
description = "Minimal example application built on takflow (toy weather-forecast workflow generator)."
requires-python = ">=3.10"
dependencies = [
    "takflow",
    "click",
    "jinja2",
    "pyyaml",
]

[project.scripts]
toyflow = "toyflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# resources/ 不是 Python 包，需要显式声明为包数据才会被安装。
[tool.setuptools.package-data]
toyflow = ["resources/**/*"]
