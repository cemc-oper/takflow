# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-26.04
  tools:
    python: "3.12"
  jobs:
    # Install with uv instead of pip so the PEP 735 "docs" dependency-group in
    # pyproject.toml is used directly (pip extras are not defined).
    create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
      - uv venv $READTHEDOCS_VIRTUALENV_PATH
    install:
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH uv pip install --group docs -e .

sphinx:
  configuration: docs/source/conf.py
