name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm derives the version from git history/tags
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install package with dev dependencies
        run: uv pip install --system -e . --group dev

      - name: Run tests
        run: pytest -v

  conformance:
    name: jobspec conformance (orvix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read pinned orvix ref
        run: echo "ORVIX_REF=$(cat src/takflow/spec/jobspec/ORVIX_VERSION)" >> "$GITHUB_ENV"

      - name: Clone orvix at the pinned ref
        # The pin may be a tag or a SHA; fetch by ref works for both on GitHub.
        run: |
          git init /tmp/orvix
          git -C /tmp/orvix remote add origin https://github.com/cemc-oper/orvix.git
          git -C /tmp/orvix fetch --depth 1 origin "$ORVIX_REF"
          git -C /tmp/orvix checkout FETCH_HEAD

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: /tmp/orvix/go.mod

      - name: Build orvix from the pinned source
        run: |
          go build -o orvix-bin .
          sudo install -m 755 orvix-bin /usr/local/bin/orvix
        working-directory: /tmp/orvix

      - name: Check vendored contract matches the pin
        run: python scripts/sync_jobspec.py --check --orvix-repo /tmp/orvix

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install takflow with dev dependencies
        run: uv pip install --system -e . --group dev

      - name: Run conformance tests
        run: pytest tests/test_conformance.py -v

  build:
    name: build check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check distributions
        run: twine check dist/*
